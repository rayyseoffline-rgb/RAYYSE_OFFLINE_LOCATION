<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAYYSE OFFLINE LOCATION</title>

<style>
body{
    margin:0;
    font-family:tahoma, sans-serif;
    background:#111827;
    color:white;
    text-align:center;
}

.container{
    margin:80px auto;
    max-width:450px;
    padding:30px;
    background:#1f2937;
    border-radius:20px;
}

h1{
    font-size:28px;
}

p{
    color:#d1d5db;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:15px 30px;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

#result{
    margin-top:20px;
    word-break:break-all;
}
</style>

</head>

<body>

<div class="container">

<h1>📍 RAYYSE OFFLINE</h1>

<p>
ساخت لینک اشتراک موقعیت با اجازه کاربر
</p>

<button onclick="createLink()">
ساخت لینک جدید
</button>

<div id="result"></div>

</div>


<script>

function createLink(){

fetch("/create_link")

.then(response => response.json())

.then(data => {

let url = window.location.origin + data.link;

document.getElementById("result").innerHTML =
`
<p>لینک ساخته شد:</p>
<a href="${url}" target="_blank" style="color:#60a5fa">
${url}
</a>
`;

})

.catch(error=>{

document.getElementById("result").innerHTML =
"خطا در ساخت لینک";

});

}

</script>


</body>
</html>
