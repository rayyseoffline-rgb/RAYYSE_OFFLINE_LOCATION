<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Share Location</title>
</head>

<body style="text-align:center;font-family:tahoma">

<h2>📍 اشتراک موقعیت</h2>

<p>برای ارسال موقعیت، اجازه دسترسی را بدهید.</p>

<button onclick="sendLocation()">
ارسال موقعیت
</button>


<script>

function sendLocation(){

navigator.geolocation.getCurrentPosition(
function(position){

fetch("/send_location/{{link_id}}",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
lat:position.coords.latitude,
lng:position.coords.longitude
})
})
.then(()=>{
alert("موقعیت ارسال شد");
});

},
function(){
alert("اجازه موقعیت داده نشد");
}
);

}

</script>

</body>
</html>
